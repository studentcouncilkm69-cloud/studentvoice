<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Voice</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Noto Sans Thai', sans-serif;
            background-color: #F7F8FA;
            color: #1F2937;
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 0;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // URL ของ Google Apps Script (Backend)
        // ==========================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwoagjo7kQFW8iZWfZtTRYYb1_jD0lPwow3DvfE-ctz8nnFnHndnjknxlhjZLz-dEIR/exec"; 

        // ข้อมูลจำลองและตัวแปรคงที่
        const FEELING_EMOJIS_DATA = [
            { emoji: '😀', label: 'ดีมาก', value: 'excellent' },
            { emoji: '🙂', label: 'ดี', value: 'good' },
            { emoji: '😐', label: 'เฉย ๆ', value: 'neutral' },
            { emoji: '🙁', label: 'ไม่ค่อยดี', value: 'bad' },
            { emoji: '😢', label: 'แย่', value: 'terrible' },
        ];
        
        const FEELING_FACTORS_DATA = [
            'เพื่อน', 'การเรียน', 'ครู', 'กิจกรรม', 'ครอบครัว', 'สถานที่', 
            'อาหาร', 'ความปลอดภัย', 'งาน / การบ้าน', 'การเดินทาง', 'เรื่องส่วนตัว', 'อื่น ๆ'
        ];

        // ==========================================
        // COMPONENT ย่อยต่างๆ (ดึงออกมาไว้นอก App แล้ว เพื่อแก้บัคจอดำ/ฟอร์มหาย)
        // ==========================================

        const Header = ({ navigateTo, onAdminTrigger }) => {
            const [logoClicks, setLogoClicks] = useState(0);
            const clickTimeoutRef = useRef(null);

            const handleLogoClick = () => {
                setLogoClicks((prev) => prev + 1);
                if (clickTimeoutRef.current) clearTimeout(clickTimeoutRef.current);
                clickTimeoutRef.current = setTimeout(() => setLogoClicks(0), 3000);

                if (logoClicks + 1 >= 5) {
                    onAdminTrigger();
                    setLogoClicks(0);
                    clearTimeout(clickTimeoutRef.current);
                }
            };

            return (
                <header className="sticky top-0 z-40 bg-white border-b border-[#E5E7EB] px-4 py-3 flex justify-between items-center shadow-sm">
                    <div className="flex items-center gap-3" onClick={handleLogoClick} style={{ cursor: 'pointer' }}>
                        <div className="w-11 h-11 rounded-full bg-gradient-to-br from-[#C8102E] to-[#9E0B23] flex items-center justify-center text-white font-bold text-xl shadow-md border-2 border-[#FDECEF]">
                            KM
                        </div>
                        <div className="flex flex-col justify-center">
                            <h1 className="font-bold text-[#1F2937] text-[15px] md:text-lg leading-tight mb-0.5">ระบบรับฟังเสียงนักเรียน</h1>
                            <p className="text-[10px] md:text-xs text-[#6B7280] font-medium leading-none tracking-wide">STUDENT COUNCIL • KHAMMUANG SCHOOL</p>
                        </div>
                    </div>
                    <button onClick={() => navigateTo('tracking')} className="text-[#6B7280] hover:text-[#C8102E] transition-colors p-2 rounded-full hover:bg-[#FDECEF]">
                        <i className="ph ph-magnifying-glass text-[22px]"></i>
                    </button>
                </header>
            );
        };

        const NavButton = ({ icon, label, view, currentView, navigateTo }) => {
            const isActive = currentView === view;
            return (
                <button onClick={() => navigateTo(view)} className={`flex flex-col items-center p-2 w-16 transition-all ${isActive ? 'text-[#C8102E]' : 'text-[#6B7280]'}`}>
                    <div className={`p-1.5 rounded-xl mb-1 flex items-center justify-center ${isActive ? 'bg-[#FDECEF]' : 'bg-transparent'}`}>
                        <i className={`ph ${icon} text-[24px] ${isActive ? 'ph-fill' : ''}`}></i>
                    </div>
                    <span className="text-[10px] font-medium">{label}</span>
                </button>
            );
        };

        const BottomNav = ({ currentView, navigateTo }) => (
            <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-[#E5E7EB] pb-safe z-40 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] md:hidden">
                <div className="flex justify-around items-center p-2">
                    <NavButton icon="ph-house" label="หน้าหลัก" view="home" currentView={currentView} navigateTo={navigateTo} />
                    <NavButton icon="ph-chat-circle" label="ความรู้สึก" view="feeling" currentView={currentView} navigateTo={navigateTo} />
                    <NavButton icon="ph-clipboard-text" label="แจ้งเรื่อง" view="issue" currentView={currentView} navigateTo={navigateTo} />
                    <NavButton icon="ph-shield-warning" label="ความปลอดภัย" view="safety" currentView={currentView} navigateTo={navigateTo} />
                </div>
            </div>
        );

        const ActionCard = ({ icon, title, desc, view, color, navigateTo }) => (
            <button onClick={() => navigateTo(view)} className="bg-white p-4 rounded-2xl border border-[#E5E7EB] shadow-[0_2px_8px_rgba(0,0,0,0.03)] hover:shadow-md hover:-translate-y-0.5 hover:border-[#FDECEF] transition-all text-left flex flex-col h-full group">
                <div className={`w-11 h-11 rounded-xl flex items-center justify-center mb-3 group-hover:scale-110 transition-transform border ${color}`}>
                    <i className={`ph ${icon} text-[22px] ph-fill`}></i>
                </div>
                <h4 className="font-semibold text-[#1F2937] text-[15px] md:text-base mb-1">{title}</h4>
                <p className="text-[11px] md:text-xs text-[#6B7280] mt-auto">{desc}</p>
            </button>
        );

        const SuccessScreen = ({ id, backTo = "home", message = "ส่งข้อมูลเรียบร้อยแล้ว", navigateTo }) => {
            const [copied, setCopied] = useState(false);
            const [countdown, setCountdown] = useState(15);

            useEffect(() => {
                const timer = setInterval(() => {
                    setCountdown((prev) => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            navigateTo(backTo);
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [backTo, navigateTo]);

            const handleCopy = () => {
                if (!id) return;
                const textArea = document.createElement("textarea");
                textArea.value = id;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                } catch (err) {
                    console.error('Copy failed', err);
                }
                document.body.removeChild(textArea);
            };

            return (
                <div className="max-w-md mx-auto px-4 py-12 text-center animate-in zoom-in-95 duration-400">
                    <div className="w-20 h-20 bg-[#16A34A] rounded-full flex items-center justify-center text-white mx-auto mb-6 shadow-lg shadow-green-100">
                        <i className="ph ph-check-circle text-[40px] ph-fill"></i>
                    </div>
                    <h2 className="text-2xl font-bold text-[#1F2937] mb-2">{message}</h2>
                    <p className="text-[#6B7280] mb-8">ขอบคุณที่ร่วมเป็นส่วนหนึ่งในการพัฒนาโรงเรียนของเรา</p>
                    
                    {id && (
                        <div className="bg-white border border-[#E5E7EB] rounded-2xl p-5 mb-8 shadow-sm">
                            <div className="p-3 bg-[#FEF2F2] rounded-xl border border-[#FECACA] mb-4">
                                <p className="text-sm font-bold text-[#DC2626] flex items-center justify-center gap-1">
                                    ⚠️ กรุณาคัดลอกรหัสหรือแคปหน้าจอเก็บไว้
                                </p>
                                <p className="text-xs text-[#991B1B] mt-1">เพื่อนำหมายเลขนี้มาใช้ติดตามสถานะเรื่องของคุณ</p>
                            </div>

                            <p className="text-sm text-[#6B7280] mb-2 font-medium">หมายเลขติดตามของคุณคือ</p>
                            
                            <div className="flex flex-col gap-3">
                                <div className="flex items-center justify-center bg-[#F7F8FA] py-4 rounded-xl border-2 border-dashed border-[#C8102E]">
                                    <span className="text-2xl md:text-3xl font-bold text-[#C8102E] tracking-widest font-mono">
                                        {id}
                                    </span>
                                </div>
                                <button onClick={handleCopy} className={`w-full font-bold py-3.5 rounded-xl transition-all flex items-center justify-center gap-2 ${copied ? 'bg-[#16A34A] text-white' : 'bg-[#1F2937] text-white hover:bg-black'}`}>
                                    {copied ? <><i className="ph ph-check text-[20px]"></i> คัดลอกแล้ว!</> : <><i className="ph ph-copy text-[20px]"></i> คัดลอกหมายเลขติดตาม</>}
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="flex flex-col gap-3">
                        <p className="text-sm text-[#6B7280] mb-2 font-medium">ระบบจะกลับสู่หน้าหลักใน {countdown} วินาที...</p>
                        <button onClick={() => navigateTo(backTo)} className="w-full bg-white text-[#4B5563] border border-[#E5E7EB] font-bold py-3.5 rounded-xl hover:bg-[#F9FAFB] transition-colors">
                            กลับหน้าหลักทันที
                        </button>
                    </div>
                </div>
            );
        };

        const HomeView = ({ navigateTo }) => (
            <div className="max-w-4xl mx-auto px-4 py-6 pb-28 animate-in fade-in duration-300">
                <div className="bg-gradient-to-br from-[#E11D48] via-[#BE123C] to-[#881337] rounded-3xl p-6 text-white shadow-[0_8px_30px_rgb(200,16,46,0.3)] mb-8 relative overflow-hidden">
                    <div className="absolute -right-6 top-0 text-white/10 rotate-12 transform scale-110 pointer-events-none">
                        <i className="ph ph-chat-teardrop-text text-[140px]"></i>
                    </div>
                    <div className="absolute right-20 -bottom-10 text-white/10 -rotate-12 transform scale-125 pointer-events-none">
                        <i className="ph ph-lightbulb text-[120px]"></i>
                    </div>
                    <div className="absolute left-16 -top-12 text-white/5 rotate-45 transform scale-110 pointer-events-none">
                        <i className="ph ph-handshake text-[150px]"></i>
                    </div>
                    <div className="absolute -left-10 bottom-2 text-white/5 -rotate-12 transform scale-90 pointer-events-none">
                        <i className="ph ph-sparkle text-[100px]"></i>
                    </div>

                    <div className="relative z-10">
                        <h2 className="text-2xl font-bold mb-2.5">ยินดีต้อนรับสู่พื้นที่ของคุณ</h2>
                        <p className="text-[#FFE4E6] text-sm md:text-base max-w-md leading-relaxed opacity-95">
                            ทุกเสียงของนักเรียนมีความหมาย ที่นี่คือพื้นที่ปลอดภัยสำหรับบอกความรู้สึก แสดงความคิดเห็น แจ้งปัญหา ขอความช่วยเหลือ และเสนอไอเดียใหม่ๆ
                        </p>
                    </div>
                </div>

                <h3 className="text-lg font-bold text-[#1F2937] mb-4 flex items-center gap-2">
                    <i className="ph ph-lightbulb text-[#C8102E] text-[20px] ph-fill"></i>
                    คุณต้องการทำอะไรในวันนี้?
                </h3>
                
                <div className="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4 mb-8">
                    <ActionCard navigateTo={navigateTo} icon="ph-chat-circle" title="ความรู้สึกของฉัน" desc="บอกเล่าความรู้สึกวันนี้" view="feeling" color="bg-blue-50 text-blue-600 border-blue-100" />
                    <ActionCard navigateTo={navigateTo} icon="ph-chat-teardrop-text" title="ความคิดเห็น" desc="เสนอแนะสิ่งต่างๆ" view="feedback" color="bg-purple-50 text-purple-600 border-purple-100" />
                    <ActionCard navigateTo={navigateTo} icon="ph-clipboard-text" title="แจ้งปัญหา" desc="ซ่อมแซม, สถานที่" view="issue" color="bg-orange-50 text-orange-600 border-orange-100" />
                    <ActionCard navigateTo={navigateTo} icon="ph-shield-warning" title="ความปลอดภัย" desc="แจ้งเหตุเร่งด่วน" view="safety" color="bg-red-50 text-[#C8102E] border-red-100" />
                    <ActionCard navigateTo={navigateTo} icon="ph-handshake" title="ขอความช่วยเหลือ" desc="ปรึกษา, ให้คนช่วย" view="help" color="bg-green-50 text-green-600 border-green-100" />
                    <ActionCard navigateTo={navigateTo} icon="ph-lightbulb" title="เสนอไอเดีย" desc="บอกไอเดียใหม่ๆ" view="idea" color="bg-yellow-50 text-yellow-600 border-yellow-100" />
                </div>

                <div className="bg-white rounded-2xl p-5 border border-[#E5E7EB] shadow-sm flex items-start gap-3">
                    <div className="mt-1 text-[#6B7280]">
                        <i className="ph ph-shield-check text-[20px]"></i>
                    </div>
                    <div>
                        <h3 className="font-bold text-[#1F2937] mb-1">ความเป็นส่วนตัวของคุณคือสิ่งสำคัญ</h3>
                        <p className="text-[13px] text-[#6B7280] leading-relaxed">
                            ระบบนี้รองรับการส่งข้อมูลแบบ <b>ไม่เปิดเผยตัวตน (Anonymous)</b> เพื่อให้นักเรียนสามารถแจ้งเรื่องราวต่างๆ ได้อย่างสบายใจ และข้อมูลทั้งหมดจะถูกจัดการด้วยมาตรฐานความปลอดภัยสูงสุด
                        </p>
                    </div>
                </div>
            </div>
        );

        const FeelingView = ({ navigateTo, submitTicket }) => {
            const [selectedFeeling, setSelectedFeeling] = useState(null);
            const [selectedFactors, setSelectedFactors] = useState([]);
            const [note, setNote] = useState('');
            const [isAnonymous, setIsAnonymous] = useState(true);
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [trackingId, setTrackingId] = useState(null);
            const [isLoading, setIsLoading] = useState(false);

            const toggleFactor = (factor) => {
                if (selectedFactors.includes(factor)) setSelectedFactors(selectedFactors.filter(f => f !== factor));
                else setSelectedFactors([...selectedFactors, factor]);
            };

            const handleSubmit = async () => {
                setIsLoading(true);
                const detailsText = `ความรู้สึก: ${selectedFeeling}\nปัจจัย: ${selectedFactors.join(', ')}\nเพิ่มเติม: ${note}`;
                const id = await submitTicket({ type: 'feeling', category: 'ความรู้สึก', details: detailsText, isAnonymous });
                setTrackingId(id);
                setIsLoading(false);
                setIsSubmitted(true);
            };

            if (isSubmitted) return <SuccessScreen id={trackingId} backTo="home" message="บันทึกความรู้สึกเรียบร้อยแล้ว" navigateTo={navigateTo} />;

            return (
                <div className="max-w-2xl mx-auto px-4 py-6 pb-28 animate-in slide-in-from-bottom-4">
                    <button onClick={() => navigateTo('home')} className="flex items-center gap-1 text-[#6B7280] mb-4 text-sm font-medium hover:text-[#C8102E]">
                        <i className="ph ph-caret-left text-[16px]"></i> กลับหน้าหลัก
                    </button>
                    <h2 className="text-2xl font-bold text-[#1F2937] mb-6">วันนี้คุณรู้สึกอย่างไร?</h2>
                    
                    <div className="bg-white rounded-3xl p-6 border border-[#E5E7EB] shadow-sm mb-6">
                        <div className="flex justify-between items-center gap-2 mb-8">
                            {FEELING_EMOJIS_DATA.map((item) => (
                                <button key={item.value} onClick={() => setSelectedFeeling(item.value)} className={`flex flex-col items-center gap-2 transition-all p-2 rounded-2xl ${selectedFeeling === item.value ? 'bg-[#FFF5F6] scale-110 shadow-sm border border-[#FDECEF]' : 'grayscale opacity-60 hover:grayscale-0 hover:opacity-100 hover:scale-105'}`}>
                                    <span className="text-4xl md:text-5xl">{item.emoji}</span>
                                    <span className={`text-xs md:text-sm font-medium ${selectedFeeling === item.value ? 'text-[#C8102E]' : 'text-[#6B7280]'}`}>{item.label}</span>
                                </button>
                            ))}
                        </div>

                        {selectedFeeling && (
                            <div className="animate-in fade-in">
                                <h3 className="font-semibold text-[#1F2937] mb-3 text-sm md:text-base">อะไรมีผลต่อความรู้สึกของคุณในวันนี้?</h3>
                                <div className="flex flex-wrap gap-2 mb-6">
                                    {FEELING_FACTORS_DATA.map((factor) => (
                                        <button key={factor} onClick={() => toggleFactor(factor)} className={`px-4 py-2 rounded-full text-xs md:text-sm font-medium border transition-all ${selectedFactors.includes(factor) ? 'bg-[#C8102E] text-white border-[#C8102E]' : 'bg-white text-[#4B5563] border-[#E5E7EB]'}`}>{factor}</button>
                                    ))}
                                </div>
                                <div className="mb-6">
                                    <label className="block font-semibold text-[#1F2937] mb-2 text-sm md:text-base">อยากเล่าอะไรเพิ่มเติมไหม? (ไม่บังคับ)</label>
                                    <textarea value={note} onChange={(e) => setNote(e.target.value)} className="w-full bg-[#F7F8FA] border border-[#E5E7EB] rounded-xl p-3 focus:outline-none focus:border-[#C8102E] text-sm min-h-[100px]" placeholder="พิมพ์ข้อความของคุณที่นี่..."></textarea>
                                </div>
                                <div className="flex items-center gap-3 mb-8 p-3 bg-[#F9FAFB] rounded-xl border border-[#E5E7EB]">
                                    <input type="checkbox" id="anonymous" checked={isAnonymous} onChange={() => setIsAnonymous(!isAnonymous)} className="w-5 h-5 accent-[#C8102E] rounded" />
                                    <label htmlFor="anonymous" className="text-sm text-[#4B5563] cursor-pointer">บันทึกแบบไม่เปิดเผยตัวตน</label>
                                </div>
                                <button onClick={handleSubmit} disabled={isLoading} className="w-full bg-[#C8102E] hover:bg-[#9E0B23] text-white font-bold py-3.5 rounded-xl shadow-md transition-colors">
                                    {isLoading ? 'กำลังบันทึก...' : 'บันทึกความรู้สึก'}
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const FeedbackView = ({ navigateTo, submitTicket }) => {
            const [step, setStep] = useState(1);
            const [formData, setFormData] = useState({ category: '', feedbackType: '', details: '', isAnonymous: true });
            const [isLoading, setIsLoading] = useState(false);
            const [trackingId, setTrackingId] = useState(null);

            const categories = ['การเรียน', 'ครู', 'เพื่อน', 'กิจกรรม', 'สถานที่', 'อาหาร', 'ความสะอาด', 'ความปลอดภัย', 'เทคโนโลยี', 'กฎระเบียบ', 'สภานักเรียน', 'อื่น ๆ'];
            const feedbackTypes = ['ชื่นชม', 'ข้อเสนอแนะ', 'ปัญหา', 'สิ่งที่อยากให้ปรับปรุง', 'ไอเดียใหม่'];

            const handleSubmit = async () => {
                setIsLoading(true);
                const id = await submitTicket({ type: 'feedback', title: `[${formData.feedbackType}] ${formData.category}`, ...formData });
                setTrackingId(id);
                setIsLoading(false);
                setStep(5);
            };

            if (step === 5) return <SuccessScreen id={trackingId} backTo="home" message="ส่งความคิดเห็นเรียบร้อยแล้ว" navigateTo={navigateTo} />;

            return (
                <div className="max-w-2xl mx-auto px-4 py-6 pb-28">
                    <div className="flex items-center gap-3 mb-6">
                        <div className="w-10 h-10 bg-[#F3E8FF] rounded-full flex items-center justify-center text-[#9333EA]"><i className="ph ph-chat-teardrop-text text-[22px] ph-fill"></i></div>
                        <h2 className="text-xl md:text-2xl font-bold text-[#1F2937]">แสดงความคิดเห็น</h2>
                    </div>
                    <div className="flex items-center mb-8">
                        {[1, 2, 3, 4].map((s) => (
                            <React.Fragment key={s}>
                                <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold border-2 transition-colors ${step >= s ? 'bg-[#9333EA] border-[#9333EA] text-white' : 'bg-white border-[#E5E7EB] text-[#9CA3AF]'}`}>{step > s ? <i className="ph ph-check-circle text-[16px]"></i> : s}</div>
                                {s < 4 && <div className={`flex-1 h-1 mx-2 rounded ${step > s ? 'bg-[#9333EA]' : 'bg-[#E5E7EB]'}`}></div>}
                            </React.Fragment>
                        ))}
                    </div>
                    <div className="bg-white rounded-3xl p-5 md:p-6 border border-[#E5E7EB] shadow-sm min-h-[300px]">
                        {step === 1 && (
                            <div className="animate-in fade-in">

                                    <table className="w-full text-sm text-left whitespace-nowrap">
                                        <thead className="bg-gray-50 text-gray-500 border-b">
                                            <tr><th className="px-4 py-3 font-medium">Tracking ID</th><th className="px-4 py-3 font-medium">หมวดหมู่</th><th className="px-4 py-3 font-medium">หัวข้อ</th><th className="px-4 py-3 font-medium">สถานะ</th></tr>
                                        </thead>
                                        <tbody>
                                            {tickets.map((t) => (
                                                <tr key={t.id} className="border-b hover:bg-gray-50 transition-colors">
                                                    <td className="px-4 py-3 font-mono text-gray-600">{t.id}</td>
                                                    <td className="px-4 py-3"><span className="px-2 py-1 rounded text-xs bg-gray-100 text-gray-600">{t.category}</span></td>
                                                    <td className="px-4 py-3 font-medium text-[#1F2937] max-w-[200px] truncate">{t.title}</td>
                                                    <td className="px-4 py-3 text-amber-600 font-medium">{t.status === 'pending' ? 'รอดำเนินการ' : t.status === 'investigating' ? 'กำลังตรวจสอบ' : 'แก้ไขแล้ว'}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Component ป๊อปอัพหน้าแรก
        const PosterPopup = () => {
            const [isVisible, setIsVisible] = useState(false);
            const [hideFor7Days, setHideFor7Days] = useState(false);

            // ข้อมูลสมมติที่ดึงมาจาก Admin Settings
            const popupSettings = {
                enabled: true, // สวิตช์จากฝั่งแอดมินว่าเปิดให้โชว์ไหม
                imageUrl: "https://images.unsplash.com/photo-1588075592446-265fd1e6e76f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80", // ลิงก์รูปตัวอย่าง
                linkUrl: "#", // ลิงก์ตอนกดรูป
                popupId: "promo_term2" // ID แคมเปญ ถ้าแอดมินเปลี่ยนรูปใหม่ ต้องเปลี่ยน ID นี้ด้วยให้มันโชว์ใหม่
            };

            useEffect(() => {
                if (popupSettings.enabled) {
                    const hiddenUntil = localStorage.getItem(`hidePopup_${popupSettings.popupId}`);
                    const now = new Date().getTime();
                    // ถ้ายังไม่มีข้อมูล หรือเลย 7 วันไปแล้ว ให้แสดง
                    if (!hiddenUntil || now > parseInt(hiddenUntil)) {
                        setIsVisible(true);
                    }
                }
            }, []);

            const handleClose = () => {
                if (hideFor7Days) {
                    // คำนวณเวลา 7 วันข้างหน้า (มิลลิวินาที)
                    const sevenDaysLater = new Date().getTime() + (7 * 24 * 60 * 60 * 1000);
                    localStorage.setItem(`hidePopup_${popupSettings.popupId}`, sevenDaysLater.toString());
                }
                setIsVisible(false);
            };

            if (!isVisible) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-in fade-in duration-300">
                    <div className="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl animate-in zoom-in-95">
                        <div className="relative">
                            {/* ปุ่มปิด */}
                            <button onClick={handleClose} className="absolute top-2 right-2 z-10 w-8 h-8 bg-black/40 hover:bg-black/60 text-white rounded-full flex items-center justify-center transition-colors">
                                <i className="ph ph-x"></i>
                            </button>
                            {/* รูปภาพ (ไม่ล็อค 16:9 จำกัดแค่ความสูงไม่ให้ล้น) */}
                            <a href={popupSettings.linkUrl} target="_blank" rel="noreferrer">
                                <img src={popupSettings.imageUrl} alt="ประกาศ" className="w-full h-auto max-h-[60vh] object-cover" />
                            </a>
                        </div>
                        <div className="p-4 bg-white border-t border-[#E5E7EB]">
                            <div className="flex items-center gap-2">
                                <input type="checkbox" id="hide7days" checked={hideFor7Days} onChange={(e) => setHideFor7Days(e.target.checked)} className="w-5 h-5 accent-[#C8102E] rounded cursor-pointer" />
                                <label htmlFor="hide7days" className="text-sm text-[#4B5563] cursor-pointer font-medium">ไม่แสดงประกาศนี้อีกเป็นเวลา 7 วัน</label>
                            </div>
                            <button onClick={handleClose} className="w-full mt-4 bg-[#F7F8FA] border border-[#E5E7EB] hover:bg-gray-100 text-[#1F2937] font-bold py-2.5 rounded-xl transition-colors">
                                ปิดหน้าต่าง
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // MAIN APP RENDER
        // ==========================================
        function App() {
            const [currentView, setCurrentView] = useState('home');
            const [isAdminAuth, setIsAdminAuth] = useState(false);
            const [tickets, setTickets] = useState([]);

            const navigateTo = (view) => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                setCurrentView(view);
            };

            const submitTicketData = async (data) => {
                // ... logic ส่งข้อมูลที่เขียนไว้ด้านบน ...
                const generateTrackingId = () => `KM-2026-${Math.floor(Math.random() * 10000).toString().padStart(4, '0')}`;
                const newId = generateTrackingId();
                const payload = { ...data, id: newId };

                const newTicket = { id: newId, status: 'pending', date: new Date().toISOString().split('T')[0], title: data.details ? data.details.substring(0, 30) + '...' : data.category, ...data };
                setTickets(prev => [newTicket, ...prev]);

                if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL !== "") {
                    try {
                        await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
                    } catch (error) { console.error("Fetch Error:", error); }
                }
                return newId;
            };

            if (currentView === 'admin-login') return <AdminLogin setCurrentView={setCurrentView} setIsAdminAuth={setIsAdminAuth} />;
            if (currentView === 'admin-dashboard' && isAdminAuth) return <AdminDashboard setCurrentView={setCurrentView} setIsAdminAuth={setIsAdminAuth} tickets={tickets} />;

            return (
                <div className="min-h-screen flex justify-center bg-gray-100 relative">
                    {/* ป๊อปอัพหน้าแรก */}
                    {currentView === 'home' && <PosterPopup />}

                    <div className="w-full max-w-md bg-[#F7F8FA] min-h-screen flex flex-col shadow-xl relative">
                        <Header navigateTo={navigateTo} onAdminTrigger={() => setCurrentView('admin-login')} />
                        <main className="flex-1 overflow-y-auto">
                            {currentView === 'home' && <HomeView navigateTo={navigateTo} />}
                            {currentView === 'feeling' && <FeelingView navigateTo={navigateTo} submitTicket={submitTicketData} />}
                            {currentView === 'feedback' && <FeedbackView navigateTo={navigateTo} submitTicket={submitTicketData} />}
                            {currentView === 'issue' && <IssueReportView navigateTo={navigateTo} submitTicket={submitTicketData} />}
                            {currentView === 'safety' && <SafetyReportView navigateTo={navigateTo} submitTicket={submitTicketData} />}
                            {currentView === 'help' && <HelpView navigateTo={navigateTo} submitTicket={submitTicketData} />}
                            {currentView === 'idea' && <IdeaView navigateTo={navigateTo} submitTicket={submitTicketData} />}
                            {currentView === 'tracking' && <TrackingView tickets={tickets} />}
                        </main>
                        <BottomNav currentView={currentView} navigateTo={navigateTo} />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
