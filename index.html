<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Voice</title>
    <meta name="title" content="Student Voice">
    <meta name="description" content="พื้นที่ปลอดภัยสำหรับบอกความรู้สึก แสดงความคิดเห็น แจ้งปัญหา หรือขอความช่วยเหลือ">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Student Voice">
    <meta property="og:description" content="พื้นที่ปลอดภัยสำหรับบอกความรู้สึก แสดงความคิดเห็น แจ้งปัญหา หรือขอความช่วยเหลือ">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');
        body { font-family: 'Noto Sans Thai', sans-serif; background-color: #E5E7EB; color: #1F2937; -webkit-font-smoothing: antialiased; margin: 0; padding: 0; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================================
        // ลิงก์ใหม่ล่าสุดที่เพิ่งอัปเดต
        // ==========================================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3CKwBAOiz6dJQWI-t8nabgSv-46yTcAI8QZHR2KFWtrGJSHuKHdnm7-sCDsfL26yu/exec";

        const HARDCODED_LOGO = "https://i.postimg.cc/wBN5btrp/rong-re-yn-kham-wng.png";
        const HARDCODED_NAME = "STUDENT COUNCIL • KHAMMUANG SCHOOL";

        const FEELING_EMOJIS_DATA = [
            { emoji: '😀', label: 'ดีมาก', value: 'excellent' }, { emoji: '🙂', label: 'ดี', value: 'good' },
            { emoji: '😐', label: 'เฉย ๆ', value: 'neutral' }, { emoji: '🙁', label: 'ไม่ค่อยดี', value: 'bad' },
            { emoji: '😢', label: 'แย่', value: 'terrible' },
        ];
        const FEELING_FACTORS_DATA = ['เพื่อน', 'การเรียน', 'ครู', 'กิจกรรม', 'ครอบครัว', 'สถานที่', 'อาหาร', 'ความปลอดภัย', 'งาน / การบ้าน', 'การเดินทาง', 'เรื่องส่วนตัว', 'อื่น ๆ'];

        // --- SHARED COMPONENTS ---
        const Header = ({ navigateTo, onAdminTrigger }) => {
            const [logoClicks, setLogoClicks] = useState(0);
            const clickTimeoutRef = useRef(null);

            const handleLogoClick = () => {
                setLogoClicks(prev => prev + 1);
                if (clickTimeoutRef.current) clearTimeout(clickTimeoutRef.current);
                clickTimeoutRef.current = setTimeout(() => setLogoClicks(0), 3000);
                if (logoClicks + 1 >= 5) { onAdminTrigger(); setLogoClicks(0); clearTimeout(clickTimeoutRef.current); }
            };

            return (
                <header className="bg-white border-b border-[#E5E7EB] px-4 py-3 flex justify-between items-center shadow-sm z-40">
                    <div className="flex items-center gap-3" onClick={handleLogoClick} style={{ cursor: 'pointer' }}>
                        <img src={HARDCODED_LOGO} alt="Logo" className="w-11 h-11 rounded-full object-cover border shadow-sm" /> 
                        <div className="flex flex-col justify-center">
                            <h1 className="font-bold text-[#1F2937] text-[15px] md:text-lg leading-tight mb-0.5">ระบบรับฟังเสียงนักเรียน</h1>
                            <p className="text-[10px] md:text-xs text-[#6B7280] font-medium leading-none tracking-wide">{HARDCODED_NAME}</p>
                        </div>
                    </div>
                    <button onClick={() => navigateTo('tracking')} className="text-[#6B7280] hover:text-[#C8102E] transition-colors p-2 rounded-full hover:bg-[#FDECEF]">
                        <i className="ph ph-magnifying-glass text-[22px]"></i>
                    </button>
                </header>
            );
        };

        const BottomNav = ({ currentView, navigateTo }) => {
            const NavButton = ({ icon, label, view }) => {
                const isActive = currentView === view;
                return (
                    <button onClick={() => navigateTo(view)} className={`flex flex-col items-center p-2 w-16 transition-all ${isActive ? 'text-[#C8102E]' : 'text-[#6B7280]'}`}>
                        <div className={`p-1.5 rounded-xl mb-1 flex items-center justify-center ${isActive ? 'bg-[#FDECEF]' : 'bg-transparent'}`}><i className={`ph ${icon} text-[24px] ${isActive ? 'ph-fill' : ''}`}></i></div>
                        <span className="text-[10px] font-medium truncate w-full text-center">{label}</span>
                    </button>
                );
            };
            return (
                <div className="bg-white border-t border-[#E5E7EB] z-40 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] pb-safe">
                    <div className="flex justify-around items-center p-1.5">
                        <NavButton icon="ph-house" label="หน้าหลัก" view="home" />
                        <NavButton icon="ph-chat-circle" label="ความรู้สึก" view="feeling" />
                        <NavButton icon="ph-clipboard-text" label="แจ้งปัญหา" view="issue" />
                        <NavButton icon="ph-shield-warning" label="แจ้งเหตุ" view="safety" />
                    </div>
                </div>
            );
        };

        const CustomAlert = ({ config, onClose }) => {
            if (!config?.isOpen) return null;
            const isError = config.type === 'error';
            const isSuccess = config.type === 'success';
            return (
                <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 modal-overlay animate-in fade-in">
                    <div className="bg-white rounded-3xl w-full max-w-xs p-6 shadow-2xl text-center animate-in zoom-in-95">
                        <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${isError ? 'bg-red-50 text-red-600' : isSuccess ? 'bg-green-50 text-green-600' : 'bg-blue-50 text-blue-600'}`}>
                            <i className={`ph text-4xl ${isError ? 'ph-x-circle' : isSuccess ? 'ph-check-circle' : 'ph-info'}`}></i>
                        </div>
                        <h3 className="text-xl font-bold text-gray-800 mb-2">{isError ? 'เกิดข้อผิดพลาด' : isSuccess ? 'สำเร็จ' : 'แจ้งเตือน'}</h3>
                        <p className="text-sm text-gray-500 mb-6">{config.message}</p>
                        <button onClick={onClose} className="w-full py-3 bg-gray-900 hover:bg-black text-white font-bold rounded-xl transition-colors shadow-md">ตกลง</button>
                    </div>
                </div>
            );
        };

        const ConfirmModal = ({ isOpen, title, message, onConfirm, onCancel }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[120] flex items-center justify-center modal-overlay p-4 animate-in fade-in">
                    <div className="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl text-center animate-in zoom-in-95">
                        <div className="w-16 h-16 bg-red-50 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i className="ph ph-warning-circle text-4xl"></i>
                        </div>
                        <h3 className="text-xl font-bold text-gray-800 mb-2">{title}</h3>
                        <p className="text-sm text-gray-500 mb-6">{message}</p>
                        <div className="flex gap-3">
                            <button onClick={onCancel} className="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl transition-colors">ยกเลิก</button>
                            <button onClick={onConfirm} className="flex-1 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl transition-colors shadow-md">ยืนยันลบ</button>
                        </div>
                    </div>
                </div>
            );
        };

        const ContactForm = ({ isAnonymous, setIsAnonymous, contactData, setContactData, accentColor, settings }) => {
            // ป้องกันการพังถ้ารายชื่อห้องว่าง
            const roomOptions = settings?.classrooms ? String(settings.classrooms).split(',').map(r => r.trim()).filter(r => r) : [];
            
            return (
                <div className="p-4 bg-[#F9FAFB] rounded-xl border mt-4">
                    <div className="flex items-start gap-3">
                        <input type="checkbox" id="anonToggle" checked={!isAnonymous} onChange={() => setIsAnonymous(!isAnonymous)} className="w-5 h-5 rounded mt-0.5 cursor-pointer" style={{accentColor: accentColor}} />
                        <label htmlFor="anonToggle" className="text-sm font-bold text-gray-700 cursor-pointer">ระบุตัวตน / ให้ติดต่อกลับ</label>
                    </div>
                    {!isAnonymous && (
                        <div className="mt-4 space-y-3 animate-in fade-in">
                            <input type="text" placeholder="ชื่อ - นามสกุล" value={contactData.name} onChange={e => setContactData({...contactData, name: e.target.value})} className="w-full bg-white border rounded-lg p-3 text-sm focus:outline-none" style={{borderColor: contactData.name ? accentColor : ''}} />
                            <div className="grid grid-cols-2 gap-3">
                                <select value={contactData.room} onChange={e => setContactData({...contactData, room: e.target.value})} className="w-full bg-white border rounded-lg p-3 text-sm focus:outline-none text-gray-700">
                                    <option value="">เลือกชั้น/ห้อง...</option>
                                    {roomOptions.map((room, idx) => (
                                        <option key={idx} value={room}>{room}</option>
                                    ))}
                                </select>
                                <input type="text" placeholder="เบอร์โทร / Line" value={contactData.phone} onChange={e => setContactData({...contactData, phone: e.target.value})} className="w-full bg-white border rounded-lg p-3 text-sm focus:outline-none" />
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const SuccessScreen = ({ id, backTo = "home", message = "ส่งข้อมูลเรียบร้อยแล้ว", navigateTo, showTrackingInfo = true }) => {
            const [copied, setCopied] = useState(false);
            const handleCopy = () => {
                if (!id) return;
                const textArea = document.createElement("textarea"); textArea.value = id; document.body.appendChild(textArea); textArea.select();
                try { document.execCommand('copy'); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch (err) {}
                document.body.removeChild(textArea);
            };

            return (
                <div className="flex flex-col items-center justify-center min-h-[70vh] px-4 text-center animate-in zoom-in-95">
                    <div className="w-20 h-20 bg-[#16A34A] rounded-full flex items-center justify-center text-white mx-auto mb-6 shadow-lg shadow-green-100"><i className="ph ph-check-circle text-[40px] ph-fill"></i></div>
                    <h2 className="text-2xl font-bold text-[#1F2937] mb-2">{message}</h2>
                    <p className="text-[#6B7280] mb-8 text-sm">ขอบคุณที่ร่วมเป็นส่วนหนึ่งในการพัฒนาโรงเรียนของเรา</p>
                    
                    {showTrackingInfo && id && (
                        <div className="bg-white border border-[#E5E7EB] rounded-2xl p-5 mb-8 shadow-sm w-full max-w-sm">
                            <div className="bg-[#FEF2F2] border border-[#FECACA] rounded-xl p-3 mb-5">
                                <p className="font-bold text-[#DC2626] text-sm flex items-center justify-center gap-1.5"><i className="ph ph-warning-circle text-lg"></i> กรุณาคัดลอกหรือแคปหน้าจอไว้!</p>
                                <p className="text-[#991B1B] text-xs mt-1">เพื่อนำหมายเลขนี้มาใช้ติดตามสถานะ</p>
                            </div>
                            <p className="text-sm text-[#6B7280] mb-2 font-medium">หมายเลขติดตามของคุณคือ</p>
                            <div className="flex flex-col gap-3">
                                <div className="flex items-center justify-center bg-[#F7F8FA] py-4 rounded-xl border-2 border-dashed border-[#C8102E]"><span className="text-2xl font-bold text-[#C8102E] tracking-widest font-mono">{id}</span></div>
                                <button onClick={handleCopy} className={`w-full font-bold py-3.5 rounded-xl transition-all flex items-center justify-center gap-2 ${copied ? 'bg-[#16A34A] text-white' : 'bg-[#1F2937] text-white hover:bg-black'}`}>
                                    {copied ? <><i className="ph ph-check text-[20px]"></i> คัดลอกแล้ว!</> : <><i className="ph ph-copy text-[20px]"></i> คัดลอกหมายเลขติดตาม</>}
                                </button>
                            </div>
                        </div>
                    )}
                    <button onClick={() => navigateTo(backTo)} className="w-full max-w-sm bg-white text-[#4B5563] border border-[#E5E7EB] font-bold py-3.5 rounded-xl hover:bg-[#F9FAFB] transition-colors">กลับหน้าหลัก</button>
                </div>
            );
        };

        const ProgressSteps = ({ total, current, color }) => (
            <div className="flex items-center mb-8">
                {Array.from({ length: total }, (_, i) => i + 1).map((s) => (
                    <React.Fragment key={s}>
                        <div className={`w-8 h-8 min-w-[32px] rounded-full flex items-center justify-center text-sm font-bold border-2 transition-colors ${current >= s ? `text-white` : 'bg-white border-[#E5E7EB] text-[#9CA3AF]'}`} style={current >= s ? {backgroundColor: color, borderColor: color} : {}}>
                            {current > s ? <i className="ph ph-check-circle text-[16px]"></i> : s}
                        </div>
                        {s < total && <div className={`flex-1 h-1 mx-2 rounded transition-colors ${current > s ? '' : 'bg-[#E5E7EB]'}`} style={current > s ? {backgroundColor: color} : {}}></div>}
                    </React.Fragment>
                ))}
            </div>
        );

        // --- USER VIEWS ---
        const HomeView = ({ navigateTo }) => (
            <div className="p-4 py-6 pb-12 animate-in fade-in duration-300">
                <div className="bg-gradient-to-br from-[#E11D48] via-[#BE123C] to-[#881337] rounded-3xl p-6 text-white shadow-[0_8px_30px_rgb(200,16,46,0.3)] mb-6 relative overflow-hidden">
                    <div className="absolute -right-6 top-0 text-white/10 rotate-12 transform scale-110 pointer-events-none"><i className="ph ph-chat-teardrop-text text-[140px]"></i></div>
                    <div className="absolute right-20 -bottom-10 text-white/10 -rotate-12 transform scale-125 pointer-events-none"><i className="ph ph-lightbulb text-[120px]"></i></div>
                    <div className="absolute left-16 -top-12 text-white/5 rotate-45 transform scale-110 pointer-events-none"><i className="ph ph-handshake text-[150px]"></i></div>
                    <div className="absolute -left-10 bottom-2 text-white/5 -rotate-12 transform scale-90 pointer-events-none"><i className="ph ph-sparkle text-[100px]"></i></div>
                    <div className="relative z-10">
                        <h2 className="text-2xl font-bold mb-2.5">ยินดีต้อนรับสู่พื้นที่ของคุณ</h2>
                        <p className="text-[#FFE4E6] text-sm md:text-base max-w-md leading-relaxed opacity-95">ทุกเสียงของนักเรียนมีความหมาย ที่นี่คือพื้นที่ปลอดภัยสำหรับบอกความรู้สึก แสดงความคิดเห็น แจ้งปัญหา ขอความช่วยเหลือ และเสนอไอเดียใหม่ๆ</p>
                    </div>
                </div>

                <div className="mb-8">
                    <button onClick={() => navigateTo('tracking')} className="w-full bg-white border border-[#E5E7EB] rounded-2xl p-4 flex items-center justify-between shadow-sm hover:shadow-md transition-all active:scale-[0.98]">
                        <div className="flex items-center gap-4">
                            <div className="w-12 h-12 bg-gray-50 rounded-full flex items-center justify-center text-gray-700">
                                <i className="ph ph-magnifying-glass text-2xl"></i>
                            </div>
                            <div className="text-left">
                                <h3 className="font-bold text-[#1F2937] text-[15px]">ติดตามสถานะเรื่องแจ้ง</h3>
                                <p className="text-xs text-[#6B7280]">กรอก Tracking ID เพื่อตรวจสอบ</p>
                            </div>
                        </div>
                        <i className="ph ph-caret-right text-gray-400 text-xl"></i>
                    </button>
                </div>

                <h3 className="text-lg font-bold text-[#1F2937] mb-4 flex items-center gap-2"><i className="ph ph-lightbulb text-[#C8102E] text-[20px] ph-fill"></i> คุณต้องการทำอะไรในวันนี้?</h3>
                <div className="grid grid-cols-2 gap-3 mb-8">
                    <button onClick={() => navigateTo('feeling')} className="bg-white p-4 rounded-2xl border hover:shadow-md transition-all text-left flex flex-col h-full group"><div className="w-11 h-11 rounded-xl flex items-center justify-center mb-3 group-hover:scale-110 transition-transform border bg-blue-50 text-blue-600 border-blue-100"><i className="ph ph-chat-circle text-[22px] ph-fill"></i></div><h4 className="font-semibold text-[15px] mb-1">ความรู้สึกของฉัน</h4><p className="text-[11px] text-[#6B7280]">บอกเล่าความรู้สึกวันนี้</p></button>
                    <button onClick={() => navigateTo('feedback')} className="bg-white p-4 rounded-2xl border hover:shadow-md transition-all text-left flex flex-col h-full group"><div className="w-11 h-11 rounded-xl flex items-center justify-center mb-3 group-hover:scale-110 transition-transform border bg-purple-50 text-purple-600 border-purple-100"><i className="ph ph-chat-teardrop-text text-[22px] ph-fill"></i></div><h4 className="font-semibold text-[15px] mb-1">ความคิดเห็น</h4><p className="text-[11px] text-[#6B7280]">เสนอแนะสิ่งต่างๆ</p></button>
                    <button onClick={() => navigateTo('issue')} className="bg-white p-4 rounded-2xl border hover:shadow-md transition-all text-left flex flex-col h-full group"><div className="w-11 h-11 rounded-xl flex items-center justify-center mb-3 group-hover:scale-110 transition-transform border bg-orange-50 text-orange-600 border-orange-100"><i className="ph ph-clipboard-text text-[22px] ph-fill"></i></div><h4 className="font-semibold text-[15px] mb-1">แจ้งซ่อม/ปัญหา</h4><p className="text-[11px] text-[#6B7280]">เช่น อาคาร 1 ห้องน้ำชาย</p></button>
                    <button onClick={() => navigateTo('safety')} className="bg-white p-4 rounded-2xl border hover:shadow-md transition-all text-left flex flex-col h-full group"><div className="w-11 h-11 rounded-xl flex items-center justify-center mb-3 group-hover:scale-110 transition-transform border bg-red-50 text-[#C8102E] border-red-100"><i className="ph ph-shield-warning text-[22px] ph-fill"></i></div><h4 className="font-semibold text-[15px] mb-1">เหตุความปลอดภัย</h4><p className="text-[11px] text-[#6B7280]">อุบัติเหตุ, ทะเลาะ, บูลลี่</p></button>
                    <button onClick={() => navigateTo('counseling')} className="bg-white p-4 rounded-2xl border hover:shadow-md transition-all text-left flex flex-col h-full group"><div className="w-11 h-11 rounded-xl flex items-center justify-center mb-3 group-hover:scale-110 transition-transform border bg-green-50 text-green-600 border-green-100"><i className="ph ph-hand-heart text-[22px] ph-fill"></i></div><h4 className="font-semibold text-[15px] mb-1">ปรึกษาปัญหาใจ</h4><p className="text-[11px] text-[#6B7280]">เครียด, การเรียน, ครอบครัว</p></button>
                    <button onClick={() => navigateTo('idea')} className="bg-white p-4 rounded-2xl border hover:shadow-md transition-all text-left flex flex-col h-full group"><div className="w-11 h-11 rounded-xl flex items-center justify-center mb-3 group-hover:scale-110 transition-transform border bg-yellow-50 text-yellow-600 border-yellow-100"><i className="ph ph-lightbulb text-[22px] ph-fill"></i></div><h4 className="font-semibold text-[15px] mb-1">เสนอไอเดีย</h4><p className="text-[11px] text-[#6B7280]">กิจกรรมใหม่ๆ, สิ่งที่อยากให้มี</p></button>
                </div>

                <div className="mt-8 mb-4">
                    <div className="bg-white rounded-[24px] p-6 border border-[#E5E7EB] shadow-sm text-center">
                        <div className="flex items-center justify-center gap-2 mb-3 text-[#10B981]">
                            <i className="ph ph-lock-key text-2xl font-bold"></i>
                            <h3 className="font-bold text-[#1F2937] text-base">รับประกันความเป็นส่วนตัวระดับสูงสุด</h3>
                        </div>
                        <p className="text-[13px] text-[#6B7280] leading-relaxed mb-5">
                            ข้อมูลของคุณได้รับการเข้ารหัสและไม่มีการบันทึก IP Address ตามมาตรฐานสากล สอดคล้องกับพ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล (PDPA)
                        </p>
                        <div className="border-t border-[#E5E7EB] pt-4 flex items-center justify-center gap-2 text-[#4B5563] font-bold text-sm">
                            <i className="ph ph-buildings text-xl"></i> สภานักเรียน โรงเรียนคำม่วง
                        </div>
                    </div>
                </div>
            </div>
        );

        const FeelingView = ({ navigateTo, submitTicket }) => {
            const [selectedFeeling, setSelectedFeeling] = useState(null);
            const [selectedFactors, setSelectedFactors] = useState([]);
            const [note, setNote] = useState('');
            const [isAnonymous, setIsAnonymous] = useState(true);
            const [trackingId, setTrackingId] = useState(null);

            const handleSubmit = async () => {
                const id = await submitTicket({ type: 'feeling', category: 'ความรู้สึก', details: `รู้สึก: ${selectedFeeling}\nปัจจัย: ${selectedFactors.join(', ')}\nเพิ่มเติม: ${note}`, isAnonymous });
                setTrackingId(id);
            };
            
            if (trackingId) return <SuccessScreen id={trackingId} navigateTo={navigateTo} message="บันทึกความรู้สึกเรียบร้อยแล้ว" showTrackingInfo={false} />;

            return (
                <div className="p-4 py-6">

            const handleLogout = () => { setIsAdminAuth(false); setCurrentView('home'); };

            const parseDateSafely = (dateStr) => {
                if (!dateStr) return new Date(0);
                const s = String(dateStr).trim();
                if (s.includes('/')) {
                    const parts = s.split(' ')[0].split('/');
                    if (parts.length === 3) return new Date(parseInt(parts[2]), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
                }
                const d = new Date(s);
                return isNaN(d.getTime()) ? new Date(0) : d;
            };

            const safeTickets = tickets || [];

            // ระบบกรองเวลาสุดแกร่ง ถ้าอ่านวันที่ไม่ได้ จะโยนเข้า All Time ทันทีไม่ให้หาย
            const filteredTickets = safeTickets.filter(t => {
                if(timeFilter === 'all') return true;
                if(!t) return false;
                
                const tDate = parseDateSafely(t?.date);
                if (tDate.getTime() === 0) return true; // ถ้าวันที่พัง ไม่ต้องซ่อน ปล่อยผ่านเลย
                
                const now = new Date();
                const diffTime = Math.abs(now.getTime() - tDate.getTime());
                const diffDays = diffTime / (1000 * 60 * 60 * 24);
                
                if(timeFilter === 'today') return diffDays <= 1.5; 
                if(timeFilter === '7days') return diffDays <= 7.5;
                if(timeFilter === '30days') return diffDays <= 30.5;
                return true; 
            });

            // นับรอดำเนินการ (รวม investigating ด้วย จะได้เป๊ะๆ)
            const getPendingCount = () => {
                return filteredTickets.filter(t => t && (t.status === 'pending' || t.status === 'investigating') && !['feeling','idea','feedback'].includes(t.type)).length;
            };

                return filteredTickets.filter(t => t && (t.status === 'resolved' || ['feeling','idea','feedback'].includes(t.type))).length;

                else if(t.type === 'idea') catCounts.idea++;
                else if(t.type === 'counseling') catCounts.counseling++;
                else if(t.type === 'safety') catCounts.safety++;
                else if(t.type === 'feedback') catCounts.feedback++;
            });

            const getPct = (count) => totalCategorized === 0 ? 0 : Math.round((count / totalCategorized) * 100);

            filteredTickets.forEach(t => {

                        </a>
                        <label className="mt-6 flex items-center gap-3 bg-black/50 border border-white/20 text-white px-5 py-2.5 rounded-full cursor-pointer hover:bg-black/70 transition-all backdrop-blur-md">
                            <input type="checkbox" checked={hideFor7Days} onChange={(e) => setHideFor7Days(e.target.checked)} className="w-5 h-5 accent-gray-500 rounded bg-transparent border-white/40 cursor-pointer" />
                            <span className="text-sm font-medium cursor-pointer">ไม่แสดงหน้านี้อีกใน 7 วัน</span>
                        </label>
                    </div>
                </div>
            );
        };

        function App() {
            const [currentView, setCurrentView] = useState('home');
            const [isAdminAuth, setIsAdminAuth] = useState(false);
            const [tickets, setTickets] = useState([]);
            const [isLoading, setIsLoading] = useState(false); 
            const [alertConfig, setAlertConfig] = useState({ isOpen: false, type: 'info', message: '' });
            
            // ยกเลิกระบบจำค่าเก่าในเครื่องทั้งหมด บังคับโหลดใหม่เสมอ
            const [settings, setSettings] = useState({ popupEnabled: false, popupImageUrl: "", classrooms: "" });
            const [isInitialFetchDone, setIsInitialFetchDone] = useState(false); 

            const showAlert = (message, type = 'info') => setAlertConfig({ isOpen: true, type, message });

            useEffect(() => {
                const fetchData = async () => {
                    if(!GOOGLE_SCRIPT_URL || !GOOGLE_SCRIPT_URL.startsWith("http")) {
                        setIsInitialFetchDone(true);
                        return;
                    }
                    setIsLoading(true);
                    try {
                        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getInitialData`);
                        const json = await res.json();
                        if(json.status === 'success') {
                            if(json.tickets && Array.isArray(json.tickets)) setTickets(json.tickets);
                            if(json.settings) {
                                const parsedSettings = {
                                    ...json.settings,
                                    popupEnabled: json.settings.popupEnabled === true || json.settings.popupEnabled === "true"
                                };
                                setSettings(parsedSettings);
                            }
                        }
                    } catch(e) { console.error("Error fetching data:", e); }
                    setIsLoading(false);
                    setIsInitialFetchDone(true);
                };
                fetchData();
            }, []);

            const navigateTo = (view) => { window.scrollTo({ top: 0, behavior: 'smooth' }); setCurrentView(view); };

            const submitTicketData = async (data) => {
                const newId = `KM-2026-${Math.floor(Math.random() * 10000).toString().padStart(4, '0')}`;
                const now = new Date();
                const formattedDate = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()}`;
                const newTicket = { id: newId, status: 'pending', date: formattedDate, title: data.title || data.category, ...data };
                
                setTickets(prev => [newTicket, ...(prev || [])]);

                if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL !== "") {
                    fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'create', ...data, id: newId })
                    }).catch(e => console.error(e));
                }
                return newId;
            };

            const updateTicketStatus = (id, newStatus) => {
                setTickets(prev => (prev || []).map(t => t.id === id ? { ...t, status: newStatus } : t));
                if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL !== "") {
                    fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'updateStatus', id: id, status: newStatus }) }).catch(e => console.error(e));
                }
            };

            const deleteTicket = (id) => {
                setTickets(prev => (prev || []).filter(t => t.id !== id));
                if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL !== "") {
                    fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'delete', id: id }) }).catch(e => console.error(e));
                }
                showAlert("ลบข้อมูลออกจากระบบแล้ว", "success");
            };

            if (currentView === 'admin-login') return <AdminLogin setCurrentView={setCurrentView} setIsAdminAuth={setIsAdminAuth} showAlert={showAlert} />;
            
            return (
                <div className="min-h-screen flex justify-center bg-gray-200">
                    <div className={`bg-[#F7F8FA] h-screen flex flex-col shadow-2xl relative overflow-hidden border-x border-gray-300 transition-all duration-300 ${isAdminAuth ? 'w-full' : 'w-full max-w-md'}`}>
                        {isLoading && <div className="absolute top-0 left-0 w-full h-1 bg-gray-200 overflow-hidden z-50"><div className="w-1/2 h-full bg-[#C8102E] animate-[slide_1.5s_ease-in-out_infinite]"></div></div>}

                        <CustomAlert config={alertConfig} onClose={() => setAlertConfig({ ...alertConfig, isOpen: false })} />

                        {isAdminAuth ? (
                            <AdminDashboard setCurrentView={setCurrentView} setIsAdminAuth={setIsAdminAuth} tickets={tickets} updateTicketStatus={updateTicketStatus} deleteTicket={deleteTicket} settings={settings} setSettings={setSettings} showAlert={showAlert} />
                        ) : (
                            <>
                                {isInitialFetchDone && <PosterPopup settings={settings} />}
                                <Header navigateTo={navigateTo} onAdminTrigger={() => setCurrentView('admin-login')} />
                                <main className="flex-1 overflow-y-auto relative">
                                    {currentView === 'home' && <HomeView navigateTo={navigateTo} />}
                                    {currentView === 'feeling' && <FeelingView navigateTo={navigateTo} submitTicket={submitTicketData} />}
                                    {currentView === 'feedback' && <FeedbackView navigateTo={navigateTo} submitTicket={submitTicketData} settings={settings} />}
                                    {currentView === 'idea' && <IdeaView navigateTo={navigateTo} submitTicket={submitTicketData} settings={settings} />}
                                    {currentView === 'issue' && <IssueReportView navigateTo={navigateTo} submitTicket={submitTicketData} showAlert={showAlert} settings={settings} />}
                                    {currentView === 'safety' && <SafetyReportView navigateTo={navigateTo} submitTicket={submitTicketData} settings={settings} />}
                                    {currentView === 'counseling' && <CounselingReportView navigateTo={navigateTo} submitTicket={submitTicketData} settings={settings} />}
                                    {currentView === 'tracking' && <TrackingView tickets={tickets} navigateTo={navigateTo} />}
                                </main>
                                <BottomNav currentView={currentView} navigateTo={navigateTo} />
                            </>
                        )}
                    </div>
                </div>
            );
        }

        const style = document.createElement('style');
        style.textContent = `@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }`;
        document.head.appendChild(style);

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
